oracle = "probe"
bound_to = [
  "apps/web/src/lib/listing-consent.sql.test.ts :: a registration row whose owner is not the package owner lists nothing",
  "apps/web/src/lib/listing-consent.sql.test.ts :: mismatched rows are deleted, matching rows kept",
]

[[claim]]
