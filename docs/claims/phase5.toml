# Phase 5 claims registry — closed-loop verification of the Phase 5 revision.
#
# One entry per requirement, each a single sentence a test could falsify.
# Sources: family docs/PHASE5-ALEMBIC.md (Track 0, A.1–A.4, A.6–A.7, B.1–B.3,
# hardening H.1–H.2), docs/Status.md and docs/DecisionLog.md 2026-10-23 entries
# (incl. "Owner rulings on Phase 5 open items" → P5.R.*), and the specs they cite
# (discovery-index, permalinks-and-registration, portal-governance,
# data-handling-review, package-contract-v2, storage-and-write-paths, the
# 2026-08-28 scale audit).
#
# Fields:
#   id        P5.<track>.<task>.<letter>   (P5.R.n = owner ruling n of 2026-10-23)
#   claim     the falsifiable sentence
#   oracle    invariant | conformance | scenario | probe | human
#   bound_to  ["<test file> :: <test title without its [id] tags>", ...]
#             The test's title carries "[<id>] " in the source; `pnpm claims`
#             checks it. [] = UNBOUND (red) — no existing test proves it yet.
#   note      optional: gaps, weak pins, why unbound
#
# Syntax: a small TOML subset (see scripts/claims-check.mjs): [[claim]] tables,
# basic "strings" (escape only \" and \\) and arrays of strings.

[registry]
name = "Alembic Phase 5"
round = "r1"
baseline = "ff39af5"

