  "apps/web/src/lib/discovery-cost.sql.test.ts :: without deferral each statement still refreshes (no lost update)",
  "apps/web/src/lib/discovery-cost.sql.test.ts :: deferral control: authenticated and service_role may call begin/end, anon may not; the queue is private",
  "apps/web/src/lib/registry-r1b.sql.test.ts :: a flush (tombstone + new row + changed row) through documents_apply refreshes the package once",
]
note = "Loop r1b (MEDIUM-3), migration 0026. PGlite, 333 shared elements: rows rewritten by a one-file save 333 → 1; its time ~205–255 ms → ~29–51 ms; refreshes per registry flush 3 → 1."

