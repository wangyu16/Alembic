[[claim]]
id = "P5.A.1.h"
claim = "A failing, slow or cancelled projector never fails the educator's write: an error is a WARNING; a statement-timeout cancel (query_canceled, which `others` does not catch) is caught by name, the refresh queued, and every later refresh of that transaction queued instead of run; inside the write, a package-level change that touches no element input refreshes the course row only, and a whole-package refresh of a live course with more than 1,000 candidate elements refreshes the course row and queues the elements, which the owner's discovery_flush_package (its own statement, after the write) drains in ≤ 1,000-element chunks of ≤ ~2 s; every manifest-cache writer drains after itself."
oracle = "invariant"
bound_to = [
  "apps/web/src/lib/discovery-projection.sql.test.ts :: a failing projector never fails the educator's write",
  "apps/web/src/lib/loop-r2-cor.sql.test.ts :: a projector cancelled by the statement timeout (57014) is queued, the write commits, later refreshes queue too",
  "apps/web/src/lib/loop-r2-cor.sql.test.ts :: a course-only edit of a 3,000-element course rewrites no element row",
  "apps/web/src/lib/loop-r2-cor.sql.test.ts :: a rename of a 3,000-element course updates the course row in the write and queues the elements; the owner's flush drains them in chunks",
  "apps/web/src/lib/loop-r2-cor.sql.test.ts :: the queue and the service flush are not the API's: anon cannot flush, authenticated cannot read the queue or drain others",
  "apps/web/src/lib/discovery-flush.test.ts :: asks the database to drain this package's queue, and never throws",
  "apps/web/src/lib/discovery-flush.test.ts :: every writer of the packages.manifest read cache drains the discovery queue after it",
]
note = "Strengthened in loop r2 correctness (M-D1, migration 0029_loop_r2c_1). Measured under the harness at 3,000 elements, unanalysed tables (PGlite): course rename in the write 3,597 ms → 49 ms (+ flush 2,118 + 37 ms after it); course description edit 2,739 → 45 ms; whole refresh, nothing changed 2,929 → 256 ms; discovery_rebuild 4,055 → 572 ms. Residual: a refresh that loses the per-package lock (L-D2) is queued and drained at the next flush (manifest write, listing, publish, restore, edit-page visit) or rebuild — not immediately."

[[claim]]
id = "P5.A.1.i"
claim = "discovery_rebuild() from empty tables reproduces every derived column of the projection, including updated_at and listed_at (recency lives in the base tables: documents.content_changed_at, packages.listing_changed_at, both trigger-owned)."
oracle = "invariant"
bound_to = [
  "apps/web/src/lib/discovery-projection.sql.test.ts :: a rebuild from empty reproduces every derived column of the projection, including updated_at and listed_at",
  "apps/web/src/lib/discovery-projection.sql.test.ts :: updated_at survives a rebuild from empty: an old listing, a public save, then a rebuild (updated_at and quality unchanged)",
  "apps/web/src/lib/discovery-projection.sql.test.ts :: content_changed_at and listing_changed_at are trigger-owned: client-supplied values are ignored",
  "apps/web/src/lib/discovery-projection.sql.test.ts :: element recency is the file's last content change: a course rename does not bump it, a save does",
]
note = "Strengthened in loop r1b (MEDIUM-5): before, a rebuild from empty reset updated_at to the listing time (quality 0.39 → 0.21 in the audit repro). Element recency is now the file content's last change; a package rename or a description/tag edit re-projects the row without bumping it."

