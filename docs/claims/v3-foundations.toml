[[claim]]
id = "K1.15"
claim = "Course operations are courseop rows (operation and arguments, actor re-checked at execution) applied at the head in order; two made at once both land unless one no longer applies; Publish waits for open ones."
oracle = "conformance"
bound_to = [
  "packages/package-ops/src/course-ops.test.ts :: two operations made from the same version both land, in order (no lost change, no browser re-apply)",
  "packages/package-ops/src/course-ops.test.ts :: an operation that no longer applies is refused with a reason, and nothing is written",
  "packages/package-ops/src/course-ops.test.ts :: adding chapters starts the parts the profile requires (concept map, study guide, assessment guide), or all five; never a chapter without them",
  "packages/package-ops/src/course-ops.test.ts :: renaming a chapter that already lacks a required part isn't a new problem (problems compare under the new title)",
  "packages/package-ops/src/course-ops.test.ts :: a course that already breaks a rule can still be changed; an operation can't introduce a new break",
  "packages/package-ops/src/course-ops.test.ts :: operations from a client are shape-checked; unknown operations and bad slugs are refused",
  "packages/package-ops/src/course-committer.test.ts :: two deputies' operations queued at the same moment both land, in order, each in its own commit",
  "packages/package-ops/src/course-committer.test.ts :: the actor's right is re-checked when the operation runs: a co-author's, or a removed member's, is refused and nothing changes",
  "packages/package-ops/src/course-committer.test.ts :: a sync queued before an operation lands first (no queue jumping), and the operation applies on top of it",
  "packages/package-ops/src/course-committer.test.ts :: a head that moves under an operation (a push on GitHub) makes it decide again on the new head",
  "apps/web/src/lib/course-ops.sql.test.ts :: a courseop row needs an actor, and Publish waits while one is on its way",
  "packages/package-ops/src/door-c-content.test.ts :: pushed course settings that are invalid, change Alembic's own fields, or list a chapter with no study guide are undone; the owner's title change is taken, anyone else's is undone",
]
note = "Built: addChapters, renameChapter, moveChapter, removeChapter, setChapterMode, setCourseDetails. Also built: setLicense (K1.18), restoreChapter (K1.16)."

