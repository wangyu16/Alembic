# Foundations step 2: history and restore (docs/specs/v3/history-v3.md, draft 2).

[[claim]]
id = "H.1"
claim = "A document's History lists its last 50 versions with when, who (from Alembic's trailers only on commits Alembic recorded; any other commit reads 'edited on GitHub', with no author name, which GitHub derives from a settable email), what, and kept and published marks; three GitHub calls per view (the version list, the head, the current text) — corrected by audit r1 M-3."
oracle = "conformance"
bound_to = [
  "packages/package-ops/src/history.test.ts :: who comes from Alembic's trailers only on commits Alembic made; a forged trailer on a GitHub push reads 'edited on GitHub'",
  "packages/package-ops/src/history.test.ts :: at most 50 entries; summaries are one plain line",
]

[[claim]]
id = "H.2"
claim = "Comparing two versions shows exactly the added and removed lines, unchanged runs folded; huge or wholly different inputs are refused quickly with bounded memory."
oracle = "conformance"
bound_to = [
  "packages/package-ops/src/diff-lines.test.ts :: the diff is exact: same + added lines rebuild the new text, same + removed rebuild the old one",
  "packages/package-ops/src/diff-lines.test.ts :: unchanged runs fold to context; a one-line edit in a long text is small",
  "packages/package-ops/src/diff-lines.test.ts :: huge or wholly different inputs are refused quickly, not computed",
]

[[claim]]
id = "H.3"
claim = "A restore brings an old version back as the newest one through the write path; if the document changed since it was seen, both are kept (current on top), never combined; only people who may edit the path can restore it."
