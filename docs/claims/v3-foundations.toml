[[claim]]
id = "H.8"
claim = "A restore references only commits in the course's own history (ancestors of the head); restored figures must be the path's own blob at that commit and pass the upload checks. (Amended 2026-10-30, owner ruling: a file is public or private by where it is, never by its text, so the private-move and answer-key refusals were removed.)"
