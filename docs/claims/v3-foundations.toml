  "packages/package-ops/src/course-committer.test.ts :: restoreChapter (from the removal's parent) brings the chapter and its parts back; a reused slug comes back under a free one, marked restored",
  "packages/package-ops/src/both-changed-items.test.ts :: typing that arrives for a removed chapter: its author is told the text is kept, and the owner and deputy are offered Restore (once per removal)",
]
note = "Built: removal, restoreChapter, and the Needs-you items (author told; owner and deputy offered Restore on the Needs-you page)."

