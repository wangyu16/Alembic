bound_to = [
  "packages/package-contract/src/site-type/status.test.ts :: pages are draft until marked completed; other public files are published as they are; any can be withdrawn",
  "packages/package-contract/src/site-type/status.test.ts :: a status follows its file: a move carries it (not into private/), a delete drops it, a restored file gets its old one back",
  "packages/package-contract/src/site-type/status.test.ts :: statuses never reach the public copy",
  "packages/package-ops/src/course-ops.test.ts :: marks many pages completed at once, and takes any public file off the website",
