bound_to = [
  "packages/package-ops/src/course-committer.test.ts :: a restore made from the current version lands as the newest version; one made from an older one keeps both, current on top, never combined",
]

[[claim]]
id = "H.6"
claim = "A snapshot is a tag on the working repo plus a row (the row's commit is the authority); names become safe slugs and never collide."
oracle = "conformance"
bound_to = [
  "apps/web/src/lib/snapshot-slug.test.ts :: a name becomes a safe tag slug; a non-Latin or empty name falls back to the date",
