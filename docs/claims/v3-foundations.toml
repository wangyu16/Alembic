  "packages/package-ops/src/course-committer.test.ts :: a status follows its file in the same commit: a move carries it, a delete drops it",
  "packages/package-ops/src/course-committer.test.ts :: marking pages draft or completed is for anyone who may edit them; taking files off the website is the owner's or deputy's, and a withdrawn page stays theirs",
]

