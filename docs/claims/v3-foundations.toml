  "apps/worker/src/raw-html.test.ts :: every Markdown text of the real General Chemistry course passes unchanged (it uses only <br>)",
  "packages/package-ops/src/publish-job.test.ts :: Publish writes each Markdown text as its clean copy, lists the files whose HTML became text, and leaves out one it can't clean",
