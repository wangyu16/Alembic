# Foundations, step 1: the course contract (package-contract-v3 draft 5,
# §0, §11–§14; FD-09, FD-10). Claims K1.10–K1.19. Unbound claims are not yet
# built and stay red until their tests exist.

[[claim]]
id = "K1.10"
claim = "A non-text file reaches the course only through the upload route; the committer accepts a blob reference only from the course_blobs ledger with a matching kind; bytes never enter the database; over 4 MB is refused with a plain message."
oracle = "conformance"
bound_to = [
  "packages/package-ops/src/course-committer.test.ts :: a picture lands only as a blob in this course's upload ledger with the path's kind; a sha queued directly, or a PNG blob at an SVG path, is refused",
  "apps/web/src/lib/upload.test.ts :: a member who may write the path can add a picture of an allowed kind up to 4 MB; anything else gets a plain reason",
]

[[claim]]
id = "K1.11"
claim = "Every course file Alembic serves carries nosniff and a sandbox CSP; bytes that don't match their kind are refused; an SVG with scripts, foreignObject, on* handlers, javascript:/data: links or external references is refused on every write and at Publish."
oracle = "conformance"
bound_to = [
  "packages/package-contract/src/files.test.ts :: a path's kind comes from the profile's figure list; editor-made SVGs are text; anything else is refused",
  "packages/package-contract/src/files.test.ts :: bytes must be what they claim: a renamed file is refused",
  "packages/package-contract/src/files.test.ts :: an SVG with a script, an event handler, embedded content, a script link or an outside reference is refused; a plain one passes",
  "packages/package-ops/src/course-committer.test.ts :: text with a script can't be saved to an SVG path, and text can't be saved to a picture's path",
  "apps/web/src/lib/upload.test.ts :: the bytes must be what the name says, and an SVG must be safe",
]
note = "Built: checks on upload and on every committed text write; the asset route already serves nosniff + a sandbox CSP. Not yet: the check at Publish, and Door C undoing unsafe pushed SVGs."

[[claim]]
id = "K1.12"
claim = "A non-text file or SVG whose base isn't current is both-changed: a kept version, nothing lost, never combined."
oracle = "conformance"
bound_to = [
  "packages/package-ops/src/course-committer.test.ts :: a picture replaced since the uploader's base keeps both: the incoming one as a kept version, the current one on top",
]

[[claim]]
id = "K1.13"
claim = "Deletes and moves check every path by role and space in one commit and keep the file mode; a listed chapter's part files, the manifest and server-only files can't be deleted or moved through them; deleting in private/ needs delete.private (owner, deputy)."
oracle = "conformance"
bound_to = [
  "packages/package-contract/src/profile/profile.test.ts :: deleting in private/ is the owner's and deputy's only",
  "packages/package-ops/src/course-committer.test.ts :: a move takes the file from the head and removes the source in one commit; a stale base, a kind change or an occupied target is refused",
  "packages/package-ops/src/course-committer.test.ts :: a listed chapter's part can't be deleted or moved away; deleting in private/ needs the owner or deputy",
]
note = "Built: delete.private, blob/move/delete rules in the committer."

[[claim]]
id = "K1.14"
claim = "private/instructor/<name>.md can be created and edited by edit.private roles and is never projectable; private/README.md is neither listed nor writable."
oracle = "conformance"
bound_to = [
  "packages/package-contract/src/profile/profile.test.ts :: instructor documents are writable by edit.private roles; the template's private/README.md and the licence files by nobody",
]

[[claim]]
id = "K1.15"
claim = "Course operations are courseop rows (operation and arguments, actor re-checked at execution) applied at the head in order; two made at once both land unless one no longer applies; Publish waits for open ones."
oracle = "conformance"
bound_to = [
  "packages/package-ops/src/course-ops.test.ts :: two operations made from the same version both land, in order (no lost change, no browser re-apply)",
  "packages/package-ops/src/course-ops.test.ts :: an operation that no longer applies is refused with a reason, and nothing is written",
  "packages/package-ops/src/course-ops.test.ts :: adding chapters starts the parts the profile requires (study guide), or all five; never a chapter without its study guide",
  "packages/package-ops/src/course-ops.test.ts :: a course that already breaks a rule can still be changed; an operation can't introduce a new break",
  "packages/package-ops/src/course-ops.test.ts :: operations from a client are shape-checked; unknown operations and bad slugs are refused",
  "packages/package-ops/src/course-committer.test.ts :: two deputies' operations queued at the same moment both land, in order, each in its own commit",
  "packages/package-ops/src/course-committer.test.ts :: the actor's right is re-checked when the operation runs: a co-author's, or a removed member's, is refused and nothing changes",
  "packages/package-ops/src/course-committer.test.ts :: a sync queued before an operation lands first (no queue jumping), and the operation applies on top of it",
  "packages/package-ops/src/course-committer.test.ts :: a head that moves under an operation (a push on GitHub) makes it decide again on the new head",
  "apps/web/src/lib/course-ops.sql.test.ts :: a courseop row needs an actor, and Publish waits while one is on its way",
]
note = "Built: addChapters, renameChapter, moveChapter, removeChapter, setChapterMode, setCourseDetails. Also built: setLicense (K1.18), restoreChapter (K1.16)."

[[claim]]
id = "K1.16"
claim = "removeChapter and restoreChapter are inverses; a sync arriving for a removed chapter's file is kept and offers Restore to the owner and deputy."
oracle = "scenario"
bound_to = [
  "packages/package-ops/src/course-ops.test.ts :: removing a chapter removes it and its part files in one change",
  "packages/package-ops/src/course-committer.test.ts :: removing a chapter removes its parts in the same commit; an operation on it afterwards is refused with a reason",
  "packages/package-ops/src/course-committer.test.ts :: restoreChapter (from the removal's parent) brings the chapter and its parts back; a reused slug comes back under a free one, marked restored",
]
note = "Built: removal and restoreChapter. Not yet: the Needs-you item that offers Restore when a late sync arrives for a removed chapter."

[[claim]]
id = "K1.17"
claim = "Course content rules live in the active content profile (package-contract/src/profile/, Coursewerk's OER profile, versioned); core code reads them through activeProfile; no file outside the profile gains course paths or licence names (ratchet over today's legacy)."
oracle = "conformance"
bound_to = [
  "packages/package-contract/src/profile/profile-boundary.scan.test.ts :: no file outside the profile gains course paths or licence names; legacy files only go down",
  "packages/package-contract/src/profile/profile.test.ts :: the active profile is Coursewerk's OER profile, versioned, and every part path maps back to its part",
  "packages/package-contract/src/profile/profile.test.ts :: a listed chapter without its study guide is a problem the profile names",
]

[[claim]]
id = "K1.18"
claim = "Only the owner changes the licence, and LICENSE/CITATION.cff follow in the same commit; Door C undoes a non-owner licence change and edits to the licence files."
oracle = "conformance"
bound_to = [
  "packages/package-ops/src/course-committer.test.ts :: only the owner changes the licence, and LICENSE and the citation's licence line follow in the same commit",
]
note = "Built: setLicense. Not yet: Door C undoing a non-owner licence change pushed on GitHub."

[[claim]]
id = "K1.19"
claim = "Upload quota and rate limits are counted from the ledger (created blobs, committed or not)."
oracle = "conformance"
bound_to = [
  "apps/web/src/lib/upload.test.ts :: uploads are limited per person and per course each hour, and by the course's total, counted from the ledger",
]
